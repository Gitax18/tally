name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tally -d tally_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://tally:tally@localhost:5432/tally_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # Includes the tracker checks: the committed t.min.js matches t.js, and it stays
      # under 1 KB gzipped (tracker/tracker_test.go).
      - name: go test
        run: go test -p 1 -count=1 -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
        env:
          API_URL: http://127.0.0.1:8090
          API_SECRET: ci-api-secret-0123456789abcdef0123456789
          SESSION_SECRET: ci-session-secret-0123456789abcdef0123

  # The whole stack in a browser: a visit to examples/demo.html must show up on the dashboard.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tally -d tally_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://tally:tally@localhost:5432/tally_test?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: web/test-results/
